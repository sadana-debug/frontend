<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Music Player & Playlist Shelf</title>
  <style>
    /* 1. Box Model Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0b1120;
      color: #e2e8f0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    /* 2. MOBILE BASE: single column stack */
    .player {
      width: 100%;
      max-width: 900px;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr;          /* 1 column on mobile */
      gap: 1.5rem;
    }

    /* Album section */
    .album {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cover {
      aspect-ratio: 1 / 1;
      max-width: 200px;
      width: 100%;
      margin: 0 auto;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Vinyl disc */
    .vinyl {
      width: 70%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      background:
        radial-gradient(circle, #38bdf8 0 14%, #0f172a 15% 30%, #1e293b 31% 100%);
      animation: spin 4s linear infinite;  /* continuous rotation */
      position: relative;
    }

    /* small mark so the rotation is visible */
    .vinyl::after {
      content: "";
      position: absolute;
      top: 10%;
      left: 50%;
      width: 4px;
      height: 18%;
      background: #94a3b8;
      border-radius: 2px;
      transform: translateX(-50%);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .song-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .song-artist {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .progress {
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: 45%;
      height: 100%;
      background: #38bdf8;
    }

    /* Queue section */
    .queue h2 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }

    .tracks {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* Each track row: Flexbox, title left, duration right */
    .track {
      width: 100%;                         /* full width rows */
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .track:hover {
      transform: translateX(6px);          /* slide right on hover */
      border-color: #38bdf8;
    }

    .track.active {
      border: 2px solid #38bdf8;
    }

    .track-info strong {
      display: block;
      font-size: 0.95rem;
    }

    .track-info small {
      color: #94a3b8;
    }

    .duration {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .play-tag {
      background: #0c4a6e;
      color: #38bdf8;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    /* Bottom playback controls: Flexbox with uniform gap */
    .controls {
      grid-column: 1 / -1;                 /* full width row */
      border-top: 1px solid #334155;
      padding-top: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .controls button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #475569;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .controls button.main {
      width: 52px;
      height: 52px;
      background: #38bdf8;
      color: #0f172a;
    }

    .controls button:active {
      transform: scale(0.92);
    }

    /* 3. DESKTOP BREAKPOINT */
    @media (min-width: 768px) {
      .player {
        grid-template-columns: 200px 1fr;  /* fixed album + fluid queue */
      }

      .cover {
        margin: 0;
      }

      .controls {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <main class="player">

    <section class="album">
      <div class="cover">
        <div class="vinyl"></div>
      </div>
      <div>
        <p class="song-title">Midnight Echoes</p>
        <p class="song-artist">Cyber Wave • 2026</p>
      </div>
      <div class="progress"><span></span></div>
    </section>

    <section class="queue">
      <h2>Up Next</h2>
      <ul class="tracks">
        <li class="track active">
          <div class="track-info"><strong>01. Neon Route</strong><small>3:42</small></div>
          <span class="play-tag">PLAY</span>
        </li>
        <li class="track">
          <div class="track-info"><strong>02. Silicon Drift</strong><small>Cyber Wave</small></div>
          <span class="duration">4:15</span>
        </li>
        <li class="track">
          <div class="track-info"><strong>03. Digital Rain</strong><small>Cyber Wave</small></div>
          <span class="duration">2:58</span>
        </li>
        <li class="track">
          <div class="track-info"><strong>04. Night Ride</strong><small>Cyber Wave</small></div>
          <span class="duration">3:10</span>
        </li>
      </ul>
    </section>

    <div class="controls">
      <button type="button" aria-label="Previous">⏮</button>
      <button type="button" class="main" aria-label="Play">▶</button>
      <button type="button" aria-label="Next">⏭</button>
    </div>

  </main>

</body>
</html>
