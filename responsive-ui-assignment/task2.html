<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Responsive Pricing Cards</title>
  <style>
    /* 1. Box Model Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .pricing {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .pricing h1 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }

    /* Billing toggle pill: inline-flex */
    .toggle {
      display: inline-flex;
      align-items: center;
      background: #e2e8f0;
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 2rem;
    }

    .toggle button {
      border: none;
      background: transparent;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .toggle button.active {
      background: #0f172a;
      color: #ffffff;
    }

    /* 2. MOBILE BASE: cards stack in one column */
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      text-align: left;
    }

    .card {
      position: relative;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 1.75rem 1.5rem;
      min-height: 360px;

      /* Flexbox column: button always sits at the bottom */
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);         /* hover lift */
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
    }

    .plan-name {
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
    }

    .plan-price {
      font-size: 2.25rem;
      font-weight: 800;
      margin: 0.5rem 0 1.25rem;
    }

    .plan-price span {
      font-size: 0.9rem;
      font-weight: 500;
      color: #64748b;
    }

    .features {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      color: #475569;
      font-size: 0.95rem;
    }

    .features li::before {
      content: "✓ ";
      color: #0284c7;
      font-weight: 700;
    }

    .btn {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: 1px solid #94a3b8;
      background: #f1f5f9;
      color: #334155;
      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* Featured Pro card */
    .card.featured {
      border: 2px solid #0284c7;
      animation: glow 2.5s ease-in-out infinite;   /* continuous pulse */
    }

    .card.featured .btn {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
    }

    .popular-badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #0284c7;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.85rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }

    /* @keyframes glow animation for the Pro card */
    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.35);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(2, 132, 199, 0);
      }
    }

    /* On mobile, show the Pro plan first (as in the blueprint) */
    .card.featured { order: -1; }

    /* 3. DESKTOP BREAKPOINT */
    @media (min-width: 850px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }

      .card.featured {
        order: 0;                          /* back to the middle */
      }
    }
  </style>
</head>
<body>

  <main class="pricing">
    <h1>Choose your plan</h1>

    <div class="toggle" role="group" aria-label="Billing period">
      <button class="active" type="button">Monthly</button>
      <button type="button">Annual</button>
    </div>

    <section class="cards">

      <article class="card">
        <div>
          <h2 class="plan-name">Starter</h2>
          <p class="plan-price">Free</p>
          <ul class="features">
            <li>1 project</li>
            <li>Basic analytics</li>
          </ul>
        </div>
        <button class="btn" type="button">Select</button>
      </article>

      <article class="card featured">
        <span class="popular-badge">POPULAR</span>
        <div>
          <h2 class="plan-name">Pro Plan</h2>
          <p class="plan-price">₹799<span>/mo</span></p>
          <ul class="features">
            <li>Unlimited projects</li>
            <li>Advanced analytics</li>
            <li>Priority support</li>
          </ul>
        </div>
        <button class="btn" type="button">Select Pro</button>
      </article>

      <article class="card">
        <div>
          <h2 class="plan-name">Team</h2>
          <p class="plan-price">₹1,999<span>/mo</span></p>
          <ul class="features">
            <li>Up to 10 members</li>
            <li>Shared workspace</li>
          </ul>
        </div>
        <button class="btn" type="button">Select</button>
      </article>

    </section>
  </main>

</body>
</html>
